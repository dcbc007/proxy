name: Build AurumProxy Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: false

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl unzip zip python3
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;28.1.13356709"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.1.13356709" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.1.13356709" >> "$GITHUB_ENV"

      - name: Fetch and patch v2ray_box plugin
        shell: bash
        run: |
          mkdir -p third_party
          git clone --depth 1 https://github.com/imanheidary/v2box.git third_party/v2box
          git -C third_party/v2box checkout bc194f6a2fddee401d1c3b8141fec8d76c8d19f3
          python3 tool/patch_v2ray_box_android.py

      - name: Verify activity-independent VPN status patch
        shell: bash
        run: |
          grep -q 'statusEventSink?.success(mapOf("status" to status.name))' third_party/v2box/android/src/main/kotlin/com/example/v2ray_box/V2rayBoxPlugin.kt
          grep -q 'Handler(android.os.Looper.getMainLooper()).post' third_party/v2box/android/src/main/kotlin/com/example/v2ray_box/V2rayBoxPlugin.kt

      - name: Verify HEV single routing architecture
        shell: bash
        run: |
          BOX_SERVICE="third_party/v2box/android/src/main/kotlin/com/example/v2ray_box/bg/BoxService.kt"
          VPN_SERVICE="third_party/v2box/android/src/main/kotlin/com/example/v2ray_box/bg/VPNService.kt"
          HEV_BRIDGE="third_party/v2box/android/src/main/kotlin/com/example/v2ray_box/bg/HevTunBridge.kt"
          VPN_ENGINE="lib/services/vpn_engine_service.dart"
          grep -q "setCoreEngine('singbox')" "$VPN_ENGINE"
          grep -q 'HevTunBridge.start(service, pfd)' "$BOX_SERVICE"
          grep -q 'HEV tun2socks -> sing-box active' "$BOX_SERVICE"
          grep -q 'private const val TUN_MTU = 9000' "$VPN_SERVICE"
          grep -q 'private const val MTU = 9000' "$HEV_BRIDGE"
          grep -q "System.loadLibrary(\"hev-socks5-tunnel\")" "$HEV_BRIDGE"
          grep -q "udp: 'udp'" "$HEV_BRIDGE"
          python3 - <<'PY'
          from pathlib import Path
          box = Path("third_party/v2box/android/src/main/kotlin/com/example/v2ray_box/bg/BoxService.kt").read_text()
          start = box.index("private suspend fun startSingboxEngine")
          end = box.index("fun serviceReload", start)
          fn = box[start:end]
          assert "HevTunBridge.start(service, pfd)" in fn
          assert "newCoreController" not in fn
          assert "Xray TUN bridge started for sing-box VPN mode" not in fn
          print("Verified Android TUN -> HEV -> sing-box data path.")
          PY

      - name: Build HEV tun2socks JNI
        shell: bash
        run: |
          rm -rf third_party/hev-socks5-tunnel /tmp/hev-build
          git clone --depth 1 --recurse-submodules https://github.com/heiher/hev-socks5-tunnel.git third_party/hev-socks5-tunnel
          git -C third_party/hev-socks5-tunnel checkout 2cdc169a248ced7097a7931aea5bf81540dc7759
          mkdir -p /tmp/hev-build/jni
          ln -s "$GITHUB_WORKSPACE/third_party/hev-socks5-tunnel" /tmp/hev-build/jni/hev-socks5-tunnel
          printf '%s\n' 'include $(call all-subdir-makefiles)' > /tmp/hev-build/jni/Android.mk
          "$ANDROID_NDK_HOME/ndk-build" \
            NDK_PROJECT_PATH=/tmp/hev-build \
            APP_BUILD_SCRIPT=/tmp/hev-build/jni/Android.mk \
            APP_ABI=arm64-v8a \
            APP_PLATFORM=android-24 \
            NDK_LIBS_OUT=/tmp/hev-build/libs \
            NDK_OUT=/tmp/hev-build/obj \
            'APP_CFLAGS=-O3 -DPKGNAME=com/example/v2ray_box/bg -DCLSNAME=HevTunBridge' \
            'APP_LDFLAGS=-Wl,--build-id=none -Wl,--hash-style=gnu'
          test -s /tmp/hev-build/libs/arm64-v8a/libhev-socks5-tunnel.so
          mkdir -p third_party/v2box/android/src/main/jniLibs/arm64-v8a
          cp /tmp/hev-build/libs/arm64-v8a/libhev-socks5-tunnel.so \
            third_party/v2box/android/src/main/jniLibs/arm64-v8a/
          HEV_LIB="third_party/v2box/android/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so"
          file "$HEV_LIB"
          readelf -Ws "$HEV_LIB" | grep -q "JNI_OnLoad"

      - name: Fetch bundled Geo databases
        shell: bash
        run: |
          mkdir -p assets/geo
          curl -fL --retry 3 -o assets/geo/geoip.dat \
            https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          curl -fL --retry 3 -o assets/geo/geosite.dat \
            https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          curl -fL --retry 3 -o assets/geo/geoip-cn.srs \
            https://raw.githubusercontent.com/SagerNet/sing-geoip/rule-set/geoip-cn.srs
          curl -fL --retry 3 -o assets/geo/geosite-geolocation-cn.srs \
            https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-geolocation-cn.srs
          curl -fL --retry 3 -o assets/geo/geosite-geolocation-!cn.srs \
            https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-geolocation-!cn.srs
          test -s assets/geo/geoip.dat
          test -s assets/geo/geosite.dat
          test -s assets/geo/geoip-cn.srs
          test -s assets/geo/geosite-geolocation-cn.srs
          test -s assets/geo/geosite-geolocation-!cn.srs

      - name: Create Android platform project
        shell: bash
        run: |
          rm -rf .aurum_scaffold android
          flutter create --platforms=android --org com.aurumproxy --project-name aurum_proxy .aurum_scaffold
          cp -R .aurum_scaffold/android ./android
          rm -rf .aurum_scaffold
          python3 tool/prepare_platforms.py "$GITHUB_WORKSPACE"
          base64 -d tool/signing/aurum-release-keystore.b64 > android/app/aurum-release.jks
          chmod 600 android/app/aurum-release.jks
          flutter pub get

      - name: Flutter static analysis
        shell: bash
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Snell config regression test
        shell: bash
        run: flutter test test/singbox_config_builder_test.dart

      - name: Desktop routing regression test
        shell: bash
        run: flutter test

      - name: HY2 and real latency integration test
        shell: bash
        run: |
          curl -fL --retry 3 -o /tmp/singbox-linux.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.14.1/sing-box-1.14.1-linux-amd64.tar.gz
          tar -xzf /tmp/singbox-linux.tar.gz -C /tmp
          dart run tool/smoke_chain_config.dart /tmp/aurum-chain.json
          /tmp/sing-box-1.14.1-linux-amd64/sing-box check -c /tmp/aurum-chain.json
          dart run tool/smoke_single_core_routes.dart /tmp/aurum-single-core
          /tmp/sing-box-1.14.1-linux-amd64/sing-box check -c /tmp/aurum-single-core-smart.json
          /tmp/sing-box-1.14.1-linux-amd64/sing-box check -c /tmp/aurum-single-core-global.json
          /tmp/sing-box-1.14.1-linux-amd64/sing-box check -c /tmp/aurum-single-core-direct.json
          python3 tool/smoke_test_singbox.py /tmp/sing-box-1.14.1-linux-amd64/sing-box

      - name: Prepare pinned libXray source
        shell: bash
        run: |
          rm -rf third_party/libXray
          git clone --depth 1 --branch v26.1.23 https://github.com/XTLS/libXray.git third_party/libXray
          cd third_party/libXray
          go mod edit -replace=gvisor.dev/gvisor=gvisor.dev/gvisor@v0.0.0-20260122175437-89a5d21be8f0
          go mod tidy
          cd "$GITHUB_WORKSPACE"

      - name: Build Android Xray TUN bridge
        shell: bash
        run: |
          bash third_party/v2box/example/scripts/build_android_libxray.sh \
            --project-root "$GITHUB_WORKSPACE" \
            --libxray-dir "$GITHUB_WORKSPACE/third_party/libXray" \
            --android-abis arm64-v8a

      - name: Build Android sing-box core
        shell: bash
        run: |
          bash third_party/v2box/example/scripts/build_android_libsingbox.sh             --project-root "$GITHUB_WORKSPACE"             --singbox-ref v1.14.1             --android-abis arm64-v8a

      - name: Build release APK
        shell: bash
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify bundled Smart Geo assets
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          unzip -l "$APK" | grep -q "assets/flutter_assets/assets/geo/geoip.dat"
          unzip -l "$APK" | grep -q "assets/flutter_assets/assets/geo/geosite.dat"
          unzip -l "$APK" | grep -q "assets/flutter_assets/assets/geo/geoip-cn.srs"
          unzip -l "$APK" | grep -q "assets/flutter_assets/assets/geo/geosite-geolocation-cn.srs"
          unzip -l "$APK" | grep -q "assets/flutter_assets/assets/geo/geosite-geolocation-!cn.srs"

      - name: Verify sing-box and HEV native packaging
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libsingbox.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libhev-socks5-tunnel.so"
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          "$APKANALYZER" manifest print "$APK" | tee /tmp/manifest.xml
          grep -q 'android:extractNativeLibs="true"' /tmp/manifest.xml

      - name: Verify stable APK signer
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee /tmp/apk-cert.txt
          grep -qi "da0505ba9a454d0a347a2f9139323a5f635be840ef729108b7c3c18ae93b7b10" /tmp/apk-cert.txt

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/AurumProxy-1.2.2-arm64.apk
          sha256sum dist/AurumProxy-1.2.2-arm64.apk > dist/AurumProxy-1.2.2-arm64.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AurumProxy-1.2.2-arm64
          path: |
            dist/AurumProxy-1.2.2-arm64.apk
            dist/AurumProxy-1.2.2-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 14
