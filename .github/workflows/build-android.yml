name: Build AurumProxy Android APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl unzip zip python3
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;28.1.13356709"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.1.13356709" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.1.13356709" >> "$GITHUB_ENV"

      - name: Fetch v2ray_box plugin
        shell: bash
        run: |
          mkdir -p third_party
          git clone --depth 1 https://github.com/imanheidary/v2box.git third_party/v2box

      - name: Create Android platform project
        shell: bash
        run: |
          rm -rf .aurum_scaffold android
          flutter create --platforms=android --org com.aurumproxy --project-name aurum_proxy .aurum_scaffold
          cp -R .aurum_scaffold/android ./android
          rm -rf .aurum_scaffold
          python3 tool/prepare_platforms.py "$GITHUB_WORKSPACE"
          flutter pub get

      - name: Flutter static analysis
        shell: bash
        run: flutter analyze

      - name: Build Android Xray TUN bridge
        shell: bash
        run: |
          bash third_party/v2box/example/scripts/build_android_libxray.sh --project-root "$GITHUB_WORKSPACE"

      - name: Build Android sing-box core
        shell: bash
        run: |
          bash third_party/v2box/example/scripts/build_android_libsingbox.sh             --project-root "$GITHUB_WORKSPACE"             --singbox-ref v1.14.1             --android-abis arm64-v8a

      - name: Build release APK
        shell: bash
        run: flutter build apk --release --target-platform android-arm64

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/AurumProxy-1.0.0-arm64.apk
          sha256sum dist/AurumProxy-1.0.0-arm64.apk > dist/AurumProxy-1.0.0-arm64.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AurumProxy-1.0.0-arm64
          path: |
            dist/AurumProxy-1.0.0-arm64.apk
            dist/AurumProxy-1.0.0-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 14
